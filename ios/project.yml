name: RemoteCodex
options:
  bundleIdPrefix: com.remotecodex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.remotecodex.app
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  RemoteCodex:
    type: application
    platform: iOS
    sources:
      - path: RemoteCodex
    settings:
      base:
        INFOPLIST_FILE: RemoteCodex/Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecodex.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: Remote Codex
    info:
      path: RemoteCodex/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.remotecodex.app
            CFBundleURLSchemes:
              - remotecodex
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Remote Codex connects to your relay on the local network.
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
    entitlements:
      path: RemoteCodex/RemoteCodex.entitlements
  RemoteCodexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RemoteCodexUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.remotecodex.app.uitests
        TEST_TARGET_NAME: RemoteCodex
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    dependencies:
      - target: RemoteCodex
schemes:
  RemoteCodex:
    build:
      targets:
        RemoteCodex: all
        RemoteCodexUITests: [test]
    test:
      targets:
        - RemoteCodexUITests
      gatherCoverageData: false
